<style>
:root{--bg:#0f1720;--card:#18222e;--card2:#243243;--txt:#e8eef5;--mut:#8ea0b4;--acc:#ffb020;--red:#ff4d5e;--green:#2fd27a;--blue:#4aa8ff;--line:#2a3746}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
h1{margin:6px 0 2px;font-size:26px} h3{margin:0 0 8px}
.screen{display:none;height:100%;flex-direction:column}.screen.on{display:flex}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:#0b1219;border-bottom:1px solid var(--line);min-height:50px}
header .sp{flex:1}
#lead.zbig .map{height:58vh}
.map{height:42vh;min-height:220px;flex:none;z-index:1}
.panel{flex:1;overflow:auto;padding:12px;padding-bottom:max(16px,env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--card2);color:var(--txt);cursor:pointer}
button.pri{background:var(--acc);color:#1a1200;font-weight:700}
button.red{background:var(--red);color:#fff;font-weight:700}
button.grn{background:var(--green);color:#03210f;font-weight:700}
button.sm{padding:6px 10px;font-size:13px}
button.wide{width:100%;margin-top:8px}
button:disabled{opacity:.35}
input,select,textarea{font:inherit;background:#0b1219;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
input[type=checkbox]{width:22px;height:22px;flex:none}
label{display:block;margin:8px 0 4px;color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:6px 8px;background:#0b1219;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:none;padding:8px 12px;font-size:14px}.tabs button.on{background:var(--acc);color:#1a1200;font-weight:700}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:800;background:var(--card2)}
.b-hunt{background:var(--red);color:#fff}.b-hide{background:var(--green);color:#03210f}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:middle;margin-right:4px;border:2px solid #fff}
.big{font-size:30px;font-weight:800;line-height:1.1}
.mut{color:var(--mut);font-size:13px}
.jokers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.joker{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:10px;min-height:64px}
.joker b{font-size:15px}.joker span{font-size:12px;color:var(--mut)}
.trow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow .nm{flex:1;min-width:0}
.feed div{padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}.feed div:last-child{border-bottom:0}
#home{overflow-y:auto}
.home{padding:20px;max-width:520px;margin:0 auto;width:100%;flex:none}
#modal{position:fixed;inset:0;z-index:3000;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.72);padding:16px}
#modal.on{display:flex}
#modalBox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;width:100%;max-width:440px;max-height:88vh;overflow:auto}
#banners{position:fixed;top:calc(58px + env(safe-area-inset-top));left:8px;right:8px;z-index:1500;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.bn{display:none;border-radius:12px;padding:12px;font-weight:800;text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.4)}
#bnFreeze{background:#1e6edc;color:#fff;font-size:20px}
#bnHold{background:var(--acc);color:#1a1200}
#bnGroup{background:#ff7a00;color:#fff;font-size:16px}
#bnGroup.live{background:#c00018}
#bnZone{background:var(--red);color:#fff}
#bnLead{background:#7c3aed;color:#fff;font-size:13px;padding:6px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000d;color:#fff;padding:10px 16px;border-radius:12px;z-index:4000;display:none;max-width:90vw;text-align:center}
.pinglabel{background:rgba(0,0,0,.78)!important;color:#fff!important;border:0!important;border-radius:6px!important;font-weight:700;padding:2px 6px!important;box-shadow:none!important;font-size:12px}
.leaflet-tooltip-top.pinglabel:before{border-top-color:rgba(0,0,0,.78)!important}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{padding:6px 10px;font-size:13px}
.photo{max-width:100%;border-radius:10px;display:block;margin-top:6px}

.vtx{border-radius:50%;background:#fff;border:4px solid #16a34a;box-shadow:0 1px 6px rgba(0,0,0,.5)}
.vtx.red{border-color:#ff3b4e}.vtx.sel{background:#ffb020;transform:scale(1.25)}
.vmid{border-radius:50%;background:rgba(255,255,255,.75);border:2px dashed #16a34a}
.vmid.red{border-color:#ff3b4e}
code{background:#0b1219;padding:1px 5px;border-radius:5px}
</style>
</head>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setPath(o,p,v){const k=p.split('/');let c=o;for(let i=0;i<k.length-1;i++){if(typeof c[k[i]]!=='object'||c[k[i]]===null)c[k[i]]={};c=c[k[i]];}const last=k[k.length-1];if(v===null||v===undefined)delete c[last];else c[last]=JSON.parse(JSON.stringify(v));}
function dist(a,b){const R=6371000,r=Math.PI/180,dLat=(b.lat-a.lat)*r,dLng=(b.lng-a.lng)*r;const x=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function bearing(a,b){const dy=b.lat-a.lat,dx=(b.lng-a.lng)*Math.cos(a.lat*Math.PI/180);return (Math.atan2(dx,dy)*180/Math.PI+360)%360;}
function offsetPoint(lat,lng,m,deg){const b=deg*Math.PI/180;return {lat:lat+(m*Math.cos(b))/111320,lng:lng+(m*Math.sin(b))/(111320*Math.cos(lat*Math.PI/180))};}
function inPoly(pt,poly){let ins=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const yi=poly[i][0],xi=poly[i][1],yj=poly[j][0],xj=poly[j][1];if(((yi>pt.lat)!==(yj>pt.lat))&&(pt.lng<(xj-xi)*(pt.lat-yi)/(yj-yi)+xi))ins=!ins;}return ins;}
function fmt(ms){ms=Math.max(0,ms);const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function clock(t){return new Date(t).toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'});}
function cd(to){return `<span class="cd" data-to="${to}">${fmt(to-now())}</span>`;}
function ago(t){return `vor <span class="ago" data-t="${t}">${fmt(now()-t)}</span>`;}
function toast(msg,ms=2800){const e=$('#toast');e.textContent=msg;e.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>e.style.display='none',ms);}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function setHTML(el,html){if(el._h!==html){el._h=html;el.innerHTML=html;tick(true);}}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Script konnte nicht geladen werden'));document.head.appendChild(s);});}
function waitFor(fn,ms){return new Promise(res=>{const t0=Date.now();const iv=setInterval(()=>{if(fn()){clearInterval(iv);res(true);}else if(Date.now()-t0>ms){clearInterval(iv);res(false);}},150);});}
function genCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<4;i++)s+=a[Math.floor(Math.random()*a.length)];return s;}
function clean(up){const o={};for(const [k,v] of Object.entries(up))o[k]=(v===undefined||(typeof v==='number'&&!isFinite(v)))?null:(v===null?null:JSON.parse(JSON.stringify(v)));return o;}

class LocalStore{ // Demo: alles lokal im Browser
  constructor(key){this.key=key;this.subs=[];this.load();this.bc=('BroadcastChannel' in window)?new BroadcastChannel(key):null;if(this.bc)this.bc.onmessage=()=>{this.load();this.emit();};}
  load(){try{this.data=JSON.parse(localStorage.getItem(this.key)||'{}')||{}}catch(e){this.data={}}}
  offset(){return 0}
  onRoot(cb){this.subs.push(cb);setTimeout(()=>cb(this.data),0);}
  update(obj){for(const [p,v] of Object.entries(clean(obj)))setPath(this.data,p,v);this.save();return Promise.resolve();}
  clear(){this.data={};this.save();try{localStorage.removeItem(this.key+'_img')}catch(e){}return Promise.resolve();}
  pushKey(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
  save(){try{localStorage.setItem(this.key,JSON.stringify(this.data))}catch(e){}if(this.bc)this.bc.postMessage(1);this.emit();}
  emit(){this.subs.forEach(cb=>cb(this.data));}
  putImg(k,d){let m={};try{m=JSON.parse(localStorage.getItem(this.key+'_img')||'{}')}catch(e){}m[k]=d;try{localStorage.setItem(this.key+'_img',JSON.stringify(m))}catch(e){}return Promise.resolve();}
  getImg(k){try{return Promise.resolve(JSON.parse(localStorage.getItem(this.key+'_img')||'{}')[k]||null)}catch(e){return Promise.resolve(null)}}
  getTpl(){try{return Promise.resolve(JSON.parse(localStorage.getItem(this.key+'_tpl')||'null'))}catch(e){return Promise.resolve(null)}}
  putTpl(z){localStorage.setItem(this.key+'_tpl',JSON.stringify(z));return Promise.resolve();}
}
class FBStore{ // Echtbetrieb: Firebase Realtime Database
  constructor(cfg,code){if(!firebase.apps.length)firebase.initializeApp(cfg);this.db=firebase.database();this.code=code;this.ref=this.db.ref('mh/'+code);this.off=0;
    this.db.ref('.info/serverTimeOffset').on('value',s=>{this.off=s.val()||0;});
    this.db.ref('.info/connected').on('value',s=>{CONNECTED=!!s.val();scheduleRender();});}
  offset(){return this.off}
  onRoot(cb){this.ref.on('value',s=>cb(s.val()||{}),e=>toast('Datenbank-Fehler: '+e.message,6000));}
  update(obj){return this.ref.update(clean(obj)).catch(e=>toast('Speichern fehlgeschlagen: '+e.message,6000));}
  clear(){this.db.ref('mh_img/'+this.code).remove();return this.ref.remove();}
  pushKey(){return this.ref.push().key;}
  putImg(k,d){return this.db.ref('mh_img/'+this.code+'/'+k).set(d);}
  getImg(k){return this.db.ref('mh_img/'+this.code+'/'+k).once('value').then(s=>s.val());}
  getTpl(){return this.db.ref('mh_tpl/zones').once('value').then(s=>s.val());}
  putTpl(z){return this.db.ref('mh_tpl/zones').set(z);}
}

function getCfg(){
  if(FIREBASE_CONFIG) return FIREBASE_CONFIG;
  const h=new URLSearchParams(location.hash.slice(1)).get('c');
  if(h){try{const c=JSON.parse(decodeURIComponent(escape(atob(h))));localStorage.setItem('mh_cfg',JSON.stringify(c));return c;}catch(e){}}
  try{return JSON.parse(localStorage.getItem('mh_cfg')||'null')}catch(e){return null}
}
function cfgParam(c){return btoa(unescape(encodeURIComponent(JSON.stringify(c))));}
function parseCfg(txt){
  const a=txt.indexOf('{'),b=txt.lastIndexOf('}');if(a<0||b<a)throw new Error('Keine { … } gefunden');
  const c={};const re=/["']?([A-Za-z_]\w*)["']?\s*:\s*["'`]([^"'`]*)["'`]/g;let m;while((m=re.exec(txt.slice(a,b+1))))c[m[1]]=m[2];if(!c.databaseURL)throw new Error('databaseURL fehlt – zuerst die Realtime Database in Firebase erstellen');if(!c.apiKey)throw new Error('apiKey fehlt');return c;
}
async function ensureFirebase(){if(window.firebase&&firebase.database)return;await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js');}

function S(){const g=(G&&G.settings)||{};const o=Object.assign({},DEFAULT_SETTINGS,g,{hiderJokers:Object.assign({},DEFAULT_SETTINGS.hiderJokers,g.hiderJokers||{})});if(!Array.isArray(o.photoChallenges)||!o.photoChallenges.length)o.photoChallenges=DEFAULT_SETTINGS.photoChallenges;return o;}
const R_=()=>(G&&G.round)||{n:0,status:'idle'};
const teams=()=>(G&&G.teams)||{};
const myTeam=()=>teams()[MY_TEAM];
const running=()=>R_().status==='running';
const huntOn=()=>running()&&now()>=R_().huntStartAt;
function latestPos(id){const d=G&&G.pos&&G.pos[id];if(!d)return null;let b=null;for(const p of Object.values(d))if(p&&p.lat!=null&&(!b||p.t>b.t))b=p;return b;}
function activeHiders(){return Object.entries(teams()).filter(([id,o])=>o.role==='hider'&&!o.caught);}
function zoneViolation(p){const zs=Object.values((G&&G.zones)||{}).filter(z=>z.pts&&z.pts.length>=3);if(zs.some(z=>z.type==='red'&&inPoly(p,z.pts)))return 'red';const g=zs.filter(z=>z.type==='green');if(g.length&&!g.some(z=>inPoly(p,z.pts)))return 'out';return null;}
function ev(up,text,vis='all'){up['events/'+store.pushKey()]={t:now(),text,vis};}
function pushPing(up,team,pos,kind,fake){up['pings/'+store.pushKey()]={team,lat:pos?pos.lat:null,lng:pos?pos.lng:null,t:now(),kind,round:R_().n,fake:!!fake};}
function lastPing(id){let b=null;for(const p of Object.values((G&&G.pings)||{}))if(p.team===id&&p.round===R_().n&&(!b||p.t>b.t))b=p;return b;}

let storeGen=0;

let rq=false;function scheduleRender(){if(rq)return;rq=true;setTimeout(()=>{rq=false;render();},200);}
function render(force){if(!G)return;if(VIEW==='lead')renderLead(force);else if(VIEW==='player')renderPlayer();renderModal();}
let lastPhase='';
function tick(onlyText){
  const t=now();
  document.querySelectorAll('.cd').forEach(e=>e.textContent=fmt(+e.dataset.to-t));
  document.querySelectorAll('.ago').forEach(e=>e.textContent=fmt(t-+e.dataset.t));
  if(onlyText===true||!G)return;
  const hd=document.querySelector('.screen.on header');$('#banners').style.top=(hd?hd.getBoundingClientRect().bottom+6:60)+'px';
  if(VIEW==='player')playerOverlays();

  const R=R_(),tm=myTeam()||{};
  const pk=[R.status,R.n,huntOn(),(tm.shieldUntil||0)>t,(tm.freezeUntil||0)>t,Math.floor(t/10000)].join('|');

function mkMap(id){
  const m=L.map(id,{zoomControl:true}).setView(CENTER,16);
  const st='https://wmts.geo.admin.ch/1.0.0/{l}/default/current/3857/{z}/{x}/{y}.jpeg',att='© <a href="https://www.swisstopo.admin.ch" target="_blank">swisstopo</a>';
  const base={'🗺️ Landeskarte':L.tileLayer(st,{l:'ch.swisstopo.pixelkarte-farbe',maxNativeZoom:18,maxZoom:20,attribution:att}),
    '🛰️ Luftbild':L.tileLayer(st,{l:'ch.swisstopo.swissimage',maxNativeZoom:19,maxZoom:20,attribution:att}),
    '⚪ Grau':L.tileLayer(st,{l:'ch.swisstopo.pixelkarte-grau',maxNativeZoom:18,maxZoom:20,attribution:att})};
  const pref=localStorage.getItem('mh_base');(base[pref]||base['🗺️ Landeskarte']).addTo(m);
  L.control.layers(base,null,{position:'topright'}).addTo(m);m.on('baselayerchange',e=>localStorage.setItem('mh_base',e.name));
  return {m,z:L.layerGroup().addTo(m),d:L.layerGroup().addTo(m),e:L.layerGroup().addTo(m),zsig:null,fitted:false};
}
function drawZones(M){
  const zs=Object.assign({},(G&&G.zones)||{});if(M===LM&&DRAW&&DRAW.editKey)delete zs[DRAW.editKey];const sig=JSON.stringify(zs);if(sig===M.zsig)return;M.zsig=sig;M.z.clearLayers();const all=[];
  for(const z of Object.values(zs)){if(!z.pts||z.pts.length<3)continue;
    L.polygon(z.pts,{color:z.type==='red'?'#ff3b4e':'#16a34a',weight:2,fillColor:z.type==='red'?'#ff3b4e':'#22c55e',fillOpacity:z.type==='red'?.33:.13,interactive:false}).addTo(M.z);
    if(z.type==='green')all.push(...z.pts);}
  if(all.length&&!M.fitted){M.m.fitBounds(all,{padding:[16,16]});M.fitted=true;}
}
function drawPings(M,filter,showFake,perm=true){
  const by={};for(const p of Object.values((G&&G.pings)||{})){if(p.round!==R_().n||p.lat==null||!filter(p.team))continue;(by[p.team]=by[p.team]||[]).push(p);}
  for(const [id,arr] of Object.entries(by)){const tm=teams()[id];if(!tm)continue;arr.sort((a,b)=>b.t-a.t);
    arr.slice(0,4).forEach((p,i)=>{const L0=i===0;const mk=L.circleMarker([p.lat,p.lng],{radius:L0?13:6,color:tm.color,weight:L0?3:1,fillColor:tm.color,fillOpacity:L0?.35:.18,opacity:L0?1:.55,dashArray:L0?null:'3'});
      if(L0)mk.bindTooltip(`📍 ${esc(tm.name)}${showFake&&p.fake?' (FAKE)':''}${p.kind==='zone'?' 🚨':''} · ${ago(p.t)}`,{permanent:perm,direction:'top',offset:[0,-12],className:'pinglabel'});
      mk.addTo(M.d);});}
}
function liveMarkers(M){for(const [id,o] of activeHiders())if(exposed(id)){const p=latestPos(id);if(!p)continue;
  L.circle([p.lat,p.lng],{radius:25,color:'#c00018',weight:2,fillColor:'#ff2340',fillOpacity:.25,interactive:false}).addTo(M.d);
  teamDot(p,o,'🔴 LIVE '+esc(o.name),10).addTo(M.d);}}
function teamDot(p,tm,label,r=8){return L.circleMarker([p.lat,p.lng],{radius:r,color:'#fff',weight:2,fillColor:tm.color,fillOpacity:1}).bindTooltip(label,{permanent:true,direction:'top',offset:[0,-r],className:'pinglabel'});}

/* =====================================================================
   SPIEL-ENGINE (läuft auf dem Gerät der Spielleitung)
   ===================================================================== */
let endingN=-1;
function engineTick(){
  if(!G||!G.teams||!store)return;
  if(!(VIEW==='lead'||DEMO))return;
  const t=now(),s=S(),R=R_(),up={};
  const eng=G.engine;
  if(eng&&eng.dev!==DEV&&t-eng.t<15000){ENGINE_MINE=false;return;}
  ENGINE_MINE=true;
  if(!eng||eng.dev!==DEV||t-eng.t>5000)up.engine={dev:DEV,t};
  if(R.status==='running'){
    if(t>=R.endAt){if(endingN!==R.n){endingN=R.n;endRound(up);}store.update(up);return;}
    let act=0;
    for(const [id,tm] of Object.entries(G.teams)){
      if(tm.role==='hider'&&!tm.caught){
        act++;
        if(tm.nextPingAt&&t>=tm.nextPingAt){const k=autoPing(up,id,tm);up[`teams/${id}/nextPingAt`]=t+(k==='nosignal'?30000:s.pingEveryMin*60000);}
      }
      if(tm.role==='hider'||tm.role==='hunter'){ // Spielzone: Disqualifikation
        const p=latestPos(id);
        if(p&&t-p.t<60000&&(p.acc||0)<=60){const v=zoneViolation(p);
          if(v&&!tm.outSince){up[`teams/${id}/outSince`]=t;ev(up,`⚠️ ${tm.name} ist ${v==='red'?'in einer Sperrzone':'ausserhalb des Spielfelds'}!`,'lead');}
          else if(v&&t-tm.outSince>=s.dqGraceSec*1000){disqualify(up,id,tm,v);if(tm.role==='hider')act--;}
          else if(!v&&tm.outSince)up[`teams/${id}/outSince`]=null;}
      }
      if(tm.role==='hunter'&&t>=R.huntStartAt&&tm.nextCreditAt&&t>=tm.nextCreditAt){up[`teams/${id}/credits`]=(tm.credits||0)+1;up[`teams/${id}/nextCreditAt`]=tm.nextCreditAt+s.hunterJokerEveryMin*60000;}
    }
    groupCheck(up,t,s);
    speedTick(up,t,s);
    if(act<=0&&endingN!==R.n){endingN=R.n;endRound(up);ev(up,'🎯 Alle Teams wurden gefangen!','all');}
  }
  if(Object.keys(up).length)store.update(up);
}
let ENGINE_MINE=true;
function disqualify(up,id,tm,v){
  const T=`teams/${id}/`,lost=(tm.score||0)-(tm.scoreStart??(tm.score||0));
  up[T+'dqPrevRole']=tm.role;up[T+'role']='out';up[T+'dq']=true;up[T+'dqLost']=lost;up[T+'score']=tm.scoreStart??(tm.score||0);up[T+'outSince']=null;
  const sp=R_().speed;if(sp&&sp.target===id){up['round/speed']=null;}
  ev(up,`❌ ${tm.name} ist disqualifiziert (${v==='red'?'Sperrzone betreten':'Spielfeld verlassen'}) – 0 Punkte in dieser Runde.`,'all');
}
function undoDQ(id){const o=teams()[id];if(!o||!o.dq)return;const T=`teams/${id}/`;store.update({[T+'role']:o.dqPrevRole||'hider',[T+'dq']:null,[T+'score']:(o.score||0)+(o.dqLost||0),[T+'dqLost']:null,[T+'outSince']:null,[T+'nextPingAt']:o.dqPrevRole==='hider'?now()+S().pingEveryMin*60000:null});toast('Disqualifikation aufgehoben');}
function speedTick(up,t,s){
  const sp=R_().speed;if(!sp)return;const tg=teams()[sp.target];
  if(!tg||tg.role!=='hider'||tg.caught){up['round/speed']=null;return;}
  if(t>=sp.nextAt){const p=latestPos(sp.target);pushPing(up,sp.target,p&&t-p.t<120000?p:null,p&&t-p.t<120000?'speed':'nosignal');
    const left=(sp.left||1)-1;
    if(left<=0){up['round/speed']=null;ev(up,`⚡ Speedhunt auf ${tg.name} ist vorbei – entkommen!`,'all');}
    else{up['round/speed/left']=left;up['round/speed/nextAt']=sp.nextAt+60000;}}
}
function exposed(id){const o=teams()[id];return !!o&&o.role==='hider'&&!o.caught&&(o.exposedUntil||0)>now();}
function groupCheck(up,t,s){
  const groups=(G&&G.groups)||{},seen=new Set();
  if(s.groupRadius>0){
    const hs=activeHiders().map(([id,o])=>[id,o,latestPos(id)]).filter(x=>x[2]&&t-x[2].t<60000);
    for(let i=0;i<hs.length;i++)for(let j=i+1;j<hs.length;j++){
      const [a,ao,ap]=hs[i],[b,bo,bp]=hs[j];const key=[a,b].sort().join('_');const d=dist(ap,bp),g=groups[key];
      if(g){
        if(d>s.groupRadius+10){up['groups/'+key]=null;seen.add(key);if(!g.exposed)ev(up,`✅ ${ao.name} und ${bo.name} haben sich rechtzeitig getrennt.`,'lead');continue;}
        seen.add(key);
        if(t-g.since>=s.groupMin*60000){
          for(const [id,o] of [[a,ao],[b,bo]])if((o.exposedUntil||0)-t<s.groupPenaltyMin*60000-4000)up[`teams/${id}/exposedUntil`]=t+s.groupPenaltyMin*60000;
          if(!g.exposed){up[`groups/${key}/exposed`]=true;ev(up,`🔴 Gruppenbildung! ${ao.name} und ${bo.name} haben sich nicht getrennt – ihr Live-Standort ist jetzt für die Jäger sichtbar!`,'all');}
        }
      }else if(d<s.groupRadius){seen.add(key);up['groups/'+key]={a,b,since:t};ev(up,`⚠️ ${ao.name} und ${bo.name} sind näher als ${s.groupRadius} m – sie müssen sich innert ${s.groupMin} Min. trennen.`,'lead');}
    }
  }
  for(const k of Object.keys(groups))if(!seen.has(k))up['groups/'+k]=null;
}
setInterval(engineTick,1000);

function autoPing(up,id,tm){
  if(tm.skipNext){pushPing(up,id,null,'invisible');up[`teams/${id}/skipNext`]=null;ev(up,`👻 ${tm.name} war beim Ping unsichtbar!`,'all');return;}
  const p=latestPos(id);
  if(!p||now()-p.t>180000){pushPing(up,id,null,'nosignal');ev(up,`📵 ${tm.name}: kein aktuelles GPS-Signal – neuer Versuch in 30 Sek.`,'lead');return 'nosignal';}
  if(tm.fakeNext){const q=offsetPoint(p.lat,p.lng,S().fakeDist*(.75+Math.random()*.5),Math.random()*360);pushPing(up,id,q,'auto',true);up[`teams/${id}/fakeNext`]=null;return;}
  pushPing(up,id,p,'auto');
}
function endRound(up){
  const R=R_(),s=S(),t=Math.min(now(),R.endAt);
  for(const [id,tm] of Object.entries(G.teams)){
    if(tm.role==='hider'&&!tm.caught&&!tm.dq){const mins=Math.floor((t-R.startAt)/60000);const pts=mins*s.ppm+s.surviveBonus;up[`teams/${id}/score`]=(tm.score||0)+pts;ev(up,`🏆 ${tm.name} hat die Runde überlebt! (+${pts})`,'all');}
  }
  up.groups=null;up['round/status']='ended';up['round/endedAt']=now();ev(up,`🏁 Runde ${R.n} ist beendet.`,'all');
}
function catchUpdates(up,k,c,isNew){
  const tg=teams()[c.target],hu=teams()[c.hunter],R=R_(),s=S(),t=now();
  if(!tg||!hu)return false;
  if(tg.caught||tg.role!=='hider'){if(!isNew)up[`catches/${k}/status`]='no';return false;}
  if((tg.shieldUntil||0)>t){if(isNew)up['catches/'+k]={...c,status:'shield'};else up[`catches/${k}/status`]='shield';ev(up,`🛡️ Fangversuch an ${tg.name} – Schutzschild aktiv!`,'all');return false;}
  const mins=Math.floor((t-R.startAt)/60000),first=!(R.catches>0),cp=s.catchPts+(first?s.firstCatchBonus:0);
  if(isNew)up['catches/'+k]={...c,status:'ok'};else up[`catches/${k}/status`]='ok';
  const T=`teams/${c.target}/`;
  up[T+'caught']=true;up[T+'caughtAt']=t;up[T+'role']='hunter';up[T+'credits']=1;up[T+'nextCreditAt']=t+s.hunterJokerEveryMin*60000;
  up[T+'score']=(tg.score||0)+mins*s.ppm;up[T+'shieldUntil']=null;up[T+'skipNext']=null;up[T+'fakeNext']=null;up[T+'freezeUntil']=null;up[T+'exposedUntil']=null;
  up[`teams/${c.hunter}/score`]=(hu.score||0)+cp;up['round/catches']=(R.catches||0)+1;
  if(R.speed&&R.speed.target===c.target){up['round/speed']=null;if((R.speedLeft||0)>0)up['round/speedLeft']=0;ev(up,`⚡ Speedhunt erfolgreich!${(R.speedLeft||0)>0?' Der übrige Speedhunt verfällt.':''}`,'all');}
  ev(up,`🎯 ${hu.name} hat ${tg.name} gefangen! (+${cp}${first?' inkl. Bonus erster Fang':''}) ${tg.name} jagt jetzt mit.`,'all');
  return true;
}
function confirmCatch(k){const c=G.catches&&G.catches[k];if(!c||c.status!=='pending')return;const up={};catchUpdates(up,k,c,false);store.update(up);modalKey=null;}
function rejectCatch(k){const c=G.catches&&G.catches[k];if(!c)return;const up={};up[`catches/${k}/status`]='no';ev(up,`❌ ${teams()[c.target]?.name} bestreitet den Fang durch ${teams()[c.hunter]?.name} – Lehrperson entscheidet.`,'lead');ev(up,`❌ ${teams()[c.target]?.name} bestreitet den Fang.`,'hunters');store.update(up);modalKey=null;}
function directCatch(target,hunter){if(!target||!hunter||target===hunter)return;const k=store.pushKey(),up={};const ok=catchUpdates(up,k,{hunter,target,t:now(),status:'pending',round:R_().n},true);store.update(up);toast(ok?'Fang eingetragen':'Fang nicht möglich (Schutzschild oder schon gefangen)');}

let zoneBuzzed=false,PM=null,lastFix=null,lastSent=0,gpsErr=null,watchId=null,wake=null,proxFrozen=false,seenPingKey=null;
function openPlayer(team){
  MY_TEAM=team;VIEW='player';localStorage.setItem('mh_me',JSON.stringify({code:CODE,team}));
  showScreen('player');
  if(!PM){PM=mkMap('pmap');PM.m.on('click',e=>{if(DEMO&&VIEW==='player'&&MY_TEAM){store.update({[`pos/${MY_TEAM}/${DEV}`]:{lat:e.latlng.lat,lng:e.latlng.lng,acc:5,t:now()}});}});}
  PM.zsig=null;PM.centered=false;setTimeout(()=>PM.m.invalidateSize(),120);
  startGPS();render();
}
function startGPS(){
  if(DEMO)return;requestWake();
  if(watchId!==null)return;
  if(!navigator.geolocation){gpsErr='Dieses Gerät hat kein GPS im Browser.';return;}
  watchId=navigator.geolocation.watchPosition(p=>{lastFix={lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy),t:now()};gpsErr=null;sendPos(false);},
    e=>{gpsErr=e.code===1?'Standort-Zugriff verweigert. Bitte in den Handy-Einstellungen für den Browser erlauben und Seite neu laden.':'GPS-Fehler: '+e.message;scheduleRender();},
    {enableHighAccuracy:true,maximumAge:3000,timeout:20000});
  setInterval(()=>sendPos(true),5000);
}
function sendPos(force){if(!lastFix||!MY_TEAM||!store||DEMO)return;const t=now();if(t-lastSent<(force?10000:4000))return;lastSent=t;store.update({[`pos/${MY_TEAM}/${DEV}`]:{lat:lastFix.lat,lng:lastFix.lng,acc:lastFix.acc,t}});}
async function requestWake(){try{if('wakeLock' in navigator&&(!wake||wake.released))wake=await navigator.wakeLock.request('screen');}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&VIEW)requestWake();});
function myPos(){if(DEMO)return latestPos(MY_TEAM);return lastFix||latestPos(MY_TEAM);}
function myGroups(id){return Object.values((G&&G.groups)||{}).filter(g=>g&&(g.a===id||g.b===id));}
function hunterPositions(){const t=now();return Object.entries(teams()).filter(([id,o])=>o.role==='hunter'&&id!==MY_TEAM).map(([id])=>latestPos(id)).filter(p=>p&&t-p.t<60000);}

function demoSwitcher(){
  if(!DEMO)return '';
  const cur=VIEW==='lead'?'lead':MY_TEAM;
  return `<select style="width:auto;padding:5px 8px;font-size:13px" onchange="demoSwitch(this.value)"><option value="lead" ${cur==='lead'?'selected':''}>👁 Spielleitung</option>${Object.entries(teams()).map(([id,o])=>`<option value="${id}" ${cur===id?'selected':''}>👁 ${esc(o.name)}</option>`).join('')}</select>`;
}
function demoSwitch(v){closeUI();if(v==='lead')openLead();else openPlayer(v);}

function renderPlayer(){
  const tm=myTeam(),t=now(),s=S(),R=R_();
  if(!tm){setHTML($('#ppanel'),`<div class="card">Dieses Team existiert nicht mehr. <button onclick="leave()">Zurück</button></div>`);return;}
  const run=R.status==='running',hunter=run&&tm.role==='hunter',hider=run&&tm.role==='hider'&&!tm.caught;
  const role=hunter?'<span class="badge b-hunt">🎯 JÄGER</span>':hider?'<span class="badge b-hide">🏃 GEJAGT</span>':run&&tm.role==='out'?'<span class="badge" style="background:var(--red)">❌ DQ</span>':'<span class="badge">⏸ Pause</span>';
  setHTML($('#phead'),`<img src="${LOGO}" style="width:30px;height:30px" alt=""><span class="dot" style="background:${tm.color}"></span><b>${esc(tm.name)}</b>${role}<span class="sp"></span>${run?`<span class="badge">⏱ ${cd(R.endAt)}</span>`:''}<span class="badge">⭐ ${tm.score||0}</span>${demoSwitcher()}${!CONNECTED?'<span class="badge" style="background:var(--red)">offline</span>':''}`);
  // Karte
  if(PM){drawZones(PM);PM.d.clearLayers();const me=myPos();
    if(me){if(me.acc>8)L.circle([me.lat,me.lng],{radius:me.acc,color:'#4aa8ff',weight:1,fillOpacity:.07,interactive:false}).addTo(PM.d);teamDot(me,tm,'Ihr',10).addTo(PM.d);if(!PM.centered){PM.m.setView([me.lat,me.lng],17);PM.centered=true;}}
    if(hunter){drawPings(PM,id=>{const o=teams()[id];return o&&o.role==='hider'&&!o.caught;},false);
      for(const [id,o] of Object.entries(teams()))if(id!==MY_TEAM&&o.role==='hunter'){const p=latestPos(id);if(p&&t-p.t<120000)teamDot(p,o,'🎯 '+esc(o.name),6).addTo(PM.d);}
      liveMarkers(PM);}
    if(hider){drawPings(PM,id=>id===MY_TEAM,false);
      const rv=tm.reveal;if(rv&&t-rv.t<s.revealShowMin*60000)for(const [id,q] of Object.entries(rv.pts||{})){const o=teams()[id];if(o)teamDot(q,o,`🎯 ${esc(o.name)} · ${ago(rv.t)}`,8).addTo(PM.d);}}
  }
  // Panel
  let h='';

function playerOverlays(){
  const tm=myTeam(),t=now(),s=S(),R=R_();if(!tm)return;
  const hider=running()&&tm.role==='hider'&&!tm.caught;
  let fz='';
  if(hider&&huntOn()){
    const me=myPos();
    const sped=R.speed&&R.speed.target===MY_TEAM;
    if(me&&!sped){let md=Infinity;for(const hp of hunterPositions())md=Math.min(md,dist(me,hp));
      if(!proxFrozen&&md<s.freezeRadius){proxFrozen=true;buzz([400,150,400]);}else if(proxFrozen&&md>s.unfreezeRadius)proxFrozen=false;}
    if(sped){proxFrozen=false;fz=`⚡ SPEEDHUNT auf euch!<br><span style="font-size:15px">Jede Minute ein Ping (noch ${R.speed.left}) – lauft!</span>`;}
    else if(proxFrozen)fz=`🧊 JÄGER IN DER NÄHE!<br><span style="font-size:15px">Versteckt euch sofort hier in der Nähe und bleibt dort.</span>`;
  }else proxFrozen=false;
  showBn('bnFreeze',fz);
  let hold='';
  if(hider){const lp=lastPing(MY_TEAM);if(lp&&['auto','instant'].includes(lp.kind)){const left=lp.t+s.holdSec*1000-t;if(left>0)hold=`📍 Ihr wurdet angepingt! Bleibt noch ${Math.ceil(left/1000)} Sek. stehen.`;const key=lp.t+'';if(seenPingKey!==key){if(seenPingKey!==null&&left>0)buzz([200,100,200]);seenPingKey=key;}}}
  showBn('bnHold',hold);
  let gb='';const gEl=$('#bnGroup');
  if(hider){const gs=myGroups(MY_TEAM);
    if(gs.length){const g=gs.sort((a,b)=>a.since-b.since)[0];const other=teams()[g.a===MY_TEAM?g.b:g.a];const dl=g.since+s.groupMin*60000;
      gb=t<dl?`⚠️ Gruppenbildung verboten!<br><span style="font-size:14px">Ihr seid weniger als ${s.groupRadius} m von ${esc(other?.name)} entfernt. Trennt euch innert ${fmt(dl-t)}!</span>`
             :`🔴 Euer Live-Standort ist für die Jäger sichtbar!<br><span style="font-size:14px">Sofort von ${esc(other?.name)} trennen (mehr als ${s.groupRadius} m).</span>`;
      const gk=gs.map(x=>x.a+x.b+(t<dl?'w':'x')).join();if(gEl._k!==gk){gEl._k=gk;buzz([500,150,500,150,500]);}}
    else if(exposed(MY_TEAM))gb=`🔴 Live-Standort noch ${fmt(tm.exposedUntil-t)} für die Jäger sichtbar.`;
    else gEl._k='';
  }else if(running()&&tm.role==='hunter'&&huntOn()){const ex=activeHiders().filter(([id])=>exposed(id));if(ex.length){gb=`🔴 LIVE sichtbar: ${ex.map(([id,o])=>esc(o.name)).join(', ')}`;const gk=ex.map(x=>x[0]).join();if(gEl._k!==gk){gEl._k=gk;buzz([300,100,300]);}}else gEl._k='';}
  gEl.classList.toggle('live',gb.startsWith('🔴'));showBn('bnGroup',gb);
  const me=myPos();let zn='';
  if(me&&running()&&tm.role!=='out'){const v=zoneViolation(me);if(v){const left=tm.outSince?tm.outSince+s.dqGraceSec*1000-t:s.dqGraceSec*1000;zn=`${v==='red'?'🚫 Sperrzone! Sofort verlassen!':'🚫 Ausserhalb des Spielfelds! Sofort zurück!'}<br><span style="font-size:14px">Sonst Disqualifikation in ${Math.max(0,Math.ceil(left/1000))} Sek.</span>`;if(!zoneBuzzed){zoneBuzzed=true;buzz([600,200,600]);}}else zoneBuzzed=false;}
  showBn('bnZone',zn);showBn('bnLead','');
}

function compressImage(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const sc=Math.min(1,720/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);res(c.toDataURL('image/jpeg',.6));};img.onerror=()=>rej(new Error('Bild nicht lesbar'));img.src=URL.createObjectURL(file);});}

let drawSig=null,dragging=false,draftPoly=null;
const rnd=ll=>[+ll.lat.toFixed(6),+ll.lng.toFixed(6)];
function drawDraft(){
  if(!LM||dragging)return;
  const sig=DRAW?JSON.stringify([DRAW.type,DRAW.pts,DRAW.sel]):'';if(sig===drawSig)return;drawSig=sig;
  LM.e.clearLayers();draftPoly=null;if(!DRAW||!DRAW.pts.length)return;
  const red=DRAW.type==='red',c=red?'#ff3b4e':'#16a34a',n=DRAW.pts.length;
  draftPoly=(n>2?L.polygon(DRAW.pts,{color:c,weight:3,dashArray:'6',fillOpacity:.15,interactive:false}):L.polyline(DRAW.pts,{color:c,weight:3,dashArray:'6',interactive:false})).addTo(LM.e);
  const done=()=>{dragging=false;drawSig=null;renderLead(true);};
  const segs=n>2?n:n-1;
  for(let i=0;i<segs;i++){const a=DRAW.pts[i],b=DRAW.pts[(i+1)%n];const mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];let idx=null;
    const mk=L.marker(mid,{draggable:true,icon:L.divIcon({className:'vmid'+(red?' red':''),iconSize:[16,16]}),zIndexOffset:500}).addTo(LM.e);
    mk.on('dragstart',()=>{dragging=true;idx=i+1;DRAW.pts.splice(idx,0,mid);DRAW.sel=null;});
    mk.on('drag',e=>{DRAW.pts[idx]=rnd(e.target.getLatLng());draftPoly.setLatLngs(DRAW.pts);});
    mk.on('dragend',done);}
  DRAW.pts.forEach((p,i)=>{
    const mk=L.marker(p,{draggable:true,icon:L.divIcon({className:'vtx'+(red?' red':'')+(DRAW.sel===i?' sel':''),iconSize:[24,24]}),zIndexOffset:1000}).addTo(LM.e);
    mk.on('dragstart',()=>{dragging=true;DRAW.sel=i;});
    mk.on('drag',e=>{DRAW.pts[i]=rnd(e.target.getLatLng());draftPoly.setLatLngs(DRAW.pts);});
    mk.on('dragend',done);
    mk.on('click',()=>{DRAW.sel=DRAW.sel===i?null:i;drawSig=null;renderLead(true);});});
}

    <button class="pri wide" onclick="saveSettings()">💾 Speichern</button></div>
    <div class="card"><h3>🧹 Aufräumen &amp; Datenschutz</h3>
    <button class="wide" onclick="confirmDo('Alle Punkte auf 0 setzen?','resetScores')">Punkte zurücksetzen</button>
    <button class="wide" onclick="confirmDo('Alle Standorte, Pings, Fotos und Ereignisse löschen?','wipeData')">Standorte &amp; Verlauf löschen</button>
    <button class="wide red" onclick="confirmDo('Ganzes Spiel endgültig löschen?','deleteGame')">Spiel löschen</button>
    <p class="mut">Nach dem Spieltag: «Spiel löschen» entfernt alle Daten.</p></div>
    <div class="card mut">Spielcode: <b>${esc(CODE)}</b> · Gerät: ${DEV}<br>${DEMO?'Demo-Modus: Daten nur in diesem Browser.':'Verbunden mit Firebase.'}<br><button class="sm" style="margin-top:6px" onclick="leaveLead()">Spielleitung verlassen</button></div>`;
}
function saveSettings(){const o={};for(const [k] of SETTINGS_FIELDS){const v=+$('#set_'+k).value;o[k]=isFinite(v)?v:DEFAULT_SETTINGS[k];}o.hiderJokers={};for(const k of Object.keys(JH)){o.hiderJokers[k]=Math.max(0,+$('#hj_'+k).value||0);}
  if(o.unfreezeRadius<o.freezeRadius)o.unfreezeRadius=o.freezeRadius+10;o.photoChallenges=($('#set_pc').value||'').split('\n').map(x=>x.trim()).filter(Boolean);store.update({settings:o});rDur=null;rHead=null;toast('Gespeichert');}
let confirmFn=null;
function confirmDo(q,fn){confirmFn=fn;showUI(`<h3>${q}</h3><div class="row"><button onclick="closeUI()">Abbrechen</button><button class="red" onclick="closeUI();window[confirmFn]()">Ja</button></div>`);}
function resetScores(){const up={};for(const id of Object.keys(teams())){up[`teams/${id}/score`]=0;up[`teams/${id}/hunterStarts`]=0;}store.update(up);toast('Punkte zurückgesetzt');}
function wipeData(){store.update({pos:null,pings:null,events:null,catches:null,questions:null,photos:null,msg:null});if(!DEMO)store.db.ref('mh_img/'+CODE).remove();toast('Gelöscht');}
async function deleteGame(){await store.clear();localStorage.removeItem('mh_lead');if(DEMO){location.reload();return;}location.href=location.pathname;}
function leaveLead(){localStorage.removeItem('mh_lead');location.href=location.pathname;}
let JOINLINK='';
function showJoin(){
  const cfg=getCfg();JOINLINK=location.origin+location.pathname+'?g='+CODE+(cfg&&!FIREBASE_CONFIG?'#c='+cfgParam(cfg):'');
  const local=location.protocol==='file:';
  showUI(`<h3>📲 Mitspielen</h3><p>Spielcode: <span class="big">${esc(CODE)}</span></p>${local?'<p style="color:var(--red)">⚠️ Die Datei ist nur lokal geöffnet. Für Handys muss sie online sein (siehe Anleitung).</p>':''}<div id="qr" style="background:#fff;padding:10px;border-radius:10px;width:max-content;margin:8px auto"></div><p class="mut" style="word-break:break-all;font-size:11px">${esc(JOINLINK)}</p><div class="row"><button onclick="copyLink()">Link kopieren</button><button onclick="closeUI()">Schliessen</button></div>`);
  setTimeout(()=>{try{new QRCode(document.getElementById('qr'),{text:JOINLINK,width:240,height:240,correctLevel:QRCode.CorrectLevel.L});}catch(e){const q=document.getElementById('qr');if(q)q.textContent='QR-Code nicht verfügbar – Link verwenden.';}},60);
}
function copyLink(){navigator.clipboard?.writeText(JOINLINK).then(()=>toast('Link kopiert'),()=>toast('Kopieren nicht möglich'));}

/* =====================================================================
   DEMO-BOTS
   ===================================================================== */
const demoHead={};
function demoTick(){
  if(!DEMO||!G||!G.teams||!store)return;
  const t=now(),R=R_(),up={},run=R.status==='running',hunt=run&&t>=R.huntStartAt;
  for(const [id,o] of Object.entries(G.teams)){
    if(VIEW==='player'&&id===MY_TEAM)continue;
    let p=latestPos(id);
    if(!p){for(let i=0;i<30;i++){p={lat:CENTER[0]+(Math.random()-.5)*.006,lng:CENTER[1]+(Math.random()-.5)*.009};if(!zoneViolation(p))break;}}
    let speed=1.3,brg=demoHead[id]??Math.random()*360;
    if(run&&o.role==='hunter'&&hunt){speed=2.6;let best=null,bd=Infinity;
      for(const [hid,ho] of activeHiders()){const real=latestPos(hid);if(real&&dist(p,real)<70){const d=dist(p,real);if(d<bd){bd=d;best=real;}continue;}const lp=lastPing(hid);if(lp&&lp.lat!=null){const d=dist(p,lp);if(d<bd&&d>25){bd=d;best=lp;}}}
      if(best)brg=bearing(p,best)+(Math.random()-.5)*40;else brg+=(Math.random()-.5)*60;}
    else if(run&&o.role==='hider'&&!o.caught){speed=t<R.huntStartAt?2:0.8;brg+=(Math.random()-.5)*50;const gs=myGroups(id);if(gs.length&&Math.random()<.5){const g=gs[0];const op=latestPos(g.a===id?g.b:g.a);if(op){brg=bearing(op,p);speed=1.6;}}if((o.freezeUntil||0)>t)speed=0;}
    else brg+=(Math.random()-.5)*60;
    let np=offsetPoint(p.lat,p.lng,speed*2,brg);
    if(zoneViolation(np)){brg=(brg+150+Math.random()*60)%360;np=offsetPoint(p.lat,p.lng,speed*2,brg);if(zoneViolation(np))np=p;}
    demoHead[id]=brg;
    up[`pos/${id}/bot`]={lat:np.lat,lng:np.lng,acc:6,t};
    if(hunt&&o.role==='hunter'){for(const [hid] of activeHiders()){const hp=latestPos(hid);if(hp&&dist(np,hp)<14&&!Object.values(G.catches||{}).some(c=>c.hunter===id&&c.target===hid&&c.round===R.n&&c.status==='pending'&&t-c.t<30000)){up['catches/'+store.pushKey()]={hunter:id,target:hid,t,status:'pending',round:R.n};}}}
  }
  const bot=id=>!(VIEW==='player'&&id===MY_TEAM);
  for(const [k,c] of Object.entries(G.catches||{}))if(c.status==='pending'&&bot(c.target)&&t-c.t>2000){catchUpdates(up,k,c,false);break;}
  for(const [k,q] of Object.entries(G.questions||{}))if(!q.answer&&bot(q.to)&&t-q.t>3000){up[`questions/${k}/answer`]=Math.random()<.5?'ja':'nein';up[`questions/${k}/at`]=t;}
  for(const [k,p] of Object.entries(G.photos||{}))if(!p.img&&bot(p.to)&&t-p.t>4000){const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320"><rect width="100%" height="100%" fill="#5b7f4a"/><rect y="200" width="100%" height="120" fill="#777"/><text x="50%" y="45%" font-size="34" text-anchor="middle" fill="#fff" font-family="sans-serif">📷 Demo-Foto</text></svg>`;store.putImg(k,'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg));up[`photos/${k}/img`]=true;up[`photos/${k}/at`]=t;}
  store.update(up);
}
setInterval(demoTick,2000);

/* =====================================================================
   START
   ===================================================================== */
function renderHome(){
  const cfg=getCfg();const me=JSON.parse(localStorage.getItem('mh_me')||'null');const ld=localStorage.getItem('mh_lead');
  let r='';
  if(me&&me.code&&me.code!=='DEMO')r+=`<button class="pri wide" onclick="resumePlayer()">↩︎ Zurück ins Spiel ${esc(me.code)}</button>`;
  if(ld&&ld!=='DEMO'&&cfg)r+=`<button class="wide" onclick="openLeadCode('${esc(ld)}')">↩︎ Spielleitung ${esc(ld)} öffnen</button>`;
  $('#resume').innerHTML=r?`<div class="card">${r}</div>`:'';
  const g=new URLSearchParams(location.search).get('g');if(g)$('#jcode').value=g.toUpperCase();
  $('#leadBox').innerHTML=cfg?`<button class="pri wide" onclick="createGame()">＋ Neues Spiel erstellen</button><div class="row" style="margin-top:8px"><input id="lcode" placeholder="Code" autocapitalize="characters"><button style="flex:none" onclick="openLeadCode($('#lcode').value)">Öffnen</button></div>${FIREBASE_CONFIG?'':'<div class="card" style="margin:10px 0 0;background:var(--card2)"><b>📦 Konfiguration fest einbauen</b><p class="mut">Lädt eine index.html herunter, in der deine Firebase-Daten schon drin sind. Diese auf GitHub hochladen (alte ersetzen) – dann können SuS auf jedem Gerät nur mit dem Spielcode beitreten.</p><button class="pri wide" onclick="bakeConfig()">⬇️ index.html herunterladen</button></div><button class="sm" style="margin-top:8px" onclick="localStorage.removeItem(\'mh_cfg\');renderHome()">Firebase-Konfiguration ändern</button>'}`
   :`<p class="mut">Einmalig: Firebase-Konfiguration einfügen. Danach kannst du Spiele erstellen.</p><details style="margin-bottom:8px"><summary class="mut">So geht's (ca. 10 Min., gratis)</summary><ol class="mut" style="padding-left:18px"><li>console.firebase.google.com öffnen → <b>Projekt hinzufügen</b> (Analytics aus).</li><li>Links <b>Build → Realtime Database → Datenbank erstellen</b>, Standort <b>Belgien (europe-west1)</b>, <b>Testmodus</b>.</li><li>Zahnrad → <b>Projekteinstellungen → Meine Apps → Web (&lt;/&gt;)</b> registrieren.</li><li>Den Block <code>const firebaseConfig = {…}</code> kopieren und hier einfügen.</li></ol></details><textarea id="cfgtxt" rows="6" placeholder="const firebaseConfig = { apiKey: '…', databaseURL: '…', … };"></textarea><button class="pri wide" onclick="saveCfg()">Speichern</button>`;
}
async function bakeConfig(){
  const cfg=getCfg();if(!cfg){toast('Zuerst die Konfiguration speichern');return;}
  let src;try{src=await (await fetch(location.href.split(/[?#]/)[0],{cache:'no-store'})).text();}catch(e){toast('Geht nur, wenn die Seite online (z.B. GitHub Pages) geöffnet ist.',6000);return;}
  const mark='const FIREBASE_CONFIG = null;';if(!src.includes(mark)){toast('Diese Datei enthält schon eine Konfiguration.',5000);return;}
  src=src.replace(mark,'const FIREBASE_CONFIG = '+JSON.stringify(cfg)+';');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([src],{type:'text/html'}));a.download='index.html';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);
  toast('index.html heruntergeladen – jetzt auf GitHub hochladen',6000);
}
function saveCfg(){try{const c=parseCfg($('#cfgtxt').value);localStorage.setItem('mh_cfg',JSON.stringify(c));toast('Gespeichert');renderHome();}catch(e){toast('Fehler: '+e.message,5000);}}
async function createGame(){try{const code=genCode();await connect(code);const g=initialGame(false);let tpl=null;try{tpl=await store.getTpl();}catch(e){}if(tpl&&tpl.zones)g.zones=tpl.zones;await store.update(g);if(tpl&&tpl.zones)toast('Standard-Zonen übernommen ✔');const ok=await waitFor(()=>G&&G.teams,8000);if(!ok){toast('Keine Verbindung zur Datenbank. Regeln/URL prüfen.',6000);return;}openLead();leadTabSet(tpl&&tpl.zones?'live':'zones');if(!(tpl&&tpl.zones))toast('Spiel erstellt: '+code);}catch(e){toast('Fehler: '+e.message,6000);}}
async function openLeadCode(code){code=(code||'').trim().toUpperCase();if(!code)return;try{await connect(code);const ok=await waitFor(()=>G&&G.teams,8000);if(!ok){toast('Spiel nicht gefunden');return;}openLead();}catch(e){toast('Fehler: '+e.message,6000);}}
async function joinStep(){
  const code=$('#jcode').value.trim().toUpperCase();if(!code)return;
  if(code==='DEMO'){startDemo();return;}
  if(!getCfg()){$('#teamPick').innerHTML=`<div class="card" style="border-color:var(--red);margin-top:10px"><b>⚠️ Dieses Gerät kennt die Datenbank noch nicht.</b><p class="mut" style="margin-bottom:0">Bitte einmal den <b>QR-Code oder Link der Lehrperson</b> öffnen. Danach funktioniert auch der Spielcode.<br><br>Lehrperson: Unter «Lehrperson» → «Konfiguration fest einbauen» eine index.html herunterladen und auf GitHub hochladen – dann reicht überall der Code.</p></div>`;return;}
  $('#teamPick').innerHTML='<p class="mut">Verbinde…</p>';
  try{await connect(code);}catch(e){$('#teamPick').innerHTML=`<p style="color:var(--red)">Verbindung fehlgeschlagen: ${esc(e.message)}</p>`;return;}
  $('#teamPick').innerHTML='<p class="mut">Verbinde…</p>';
  const ok=await waitFor(()=>G&&G.teams,8000);if(!ok){$('#teamPick').innerHTML='<p style="color:var(--red)">Spiel nicht gefunden. Code prüfen.</p>';return;}
  $('#teamPick').innerHTML=`<label>Wähle dein Team</label>${Object.entries(teams()).map(([id,o])=>`<button class="wide" style="text-align:left;border-left:8px solid ${o.color}" onclick="openPlayer('${id}')">${esc(o.name)}</button>`).join('')}<p class="mut">Danach den Standort-Zugriff erlauben.</p>`;
}
async function resumePlayer(){const me=JSON.parse(localStorage.getItem('mh_me')||'null');if(!me)return;try{await connect(me.code);const ok=await waitFor(()=>G&&G.teams,8000);if(!ok){toast('Spiel nicht gefunden');return;}openPlayer(me.team);}catch(e){toast('Bitte den Link der Lehrperson erneut öffnen.',5000);}}
async function startDemo(){await connect('DEMO');await waitFor(()=>G!==null,2000);if(!G.teams)await store.update(initialGame(true));openLead();}
renderHome();
</script>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<style>
:root{--bg:#0f1720;--card:#18222e;--card2:#243243;--txt:#e8eef5;--mut:#8ea0b4;--acc:#ffb020;--red:#ff4d5e;--green:#2fd27a;--blue:#4aa8ff;--line:#2a3746}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
h1{margin:6px 0 2px;font-size:26px} h3{margin:0 0 8px}
.screen{display:none;height:100%;flex-direction:column}.screen.on{display:flex}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:#0b1219;border-bottom:1px solid var(--line);min-height:50px}
header .sp{flex:1}
#lbody{flex:1;display:flex;min-height:0}
.lnav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:8px;background:#0b1219;border-bottom:1px solid var(--line);flex:none}
.lnav button{padding:10px 4px;font-size:14px;font-weight:700;border-radius:10px}
.lnav button.on{background:var(--acc);color:#1a1200}
.sgroup{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.sgroup>summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px}
.sgroup>summary::-webkit-details-marker{display:none}
.sgroup>summary::after{content:'▾';margin-left:auto;color:var(--mut)}.sgroup[open]>summary::after{content:'▴'}
.sgroup>summary small{font-weight:400;color:var(--mut);font-size:12px}
.sbody{padding:0 14px 12px}
.srow{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.srow label{flex:1;margin:0;color:var(--txt);font-size:14px}
.srow label small{display:block;color:var(--mut);font-size:12px}
.srow .num{display:flex;align-items:center;gap:6px;flex:none}
.srow input{width:76px;text-align:right;padding:7px 8px}
.srow .unit{color:var(--mut);font-size:13px;min-width:34px}
.tline{display:grid;grid-template-columns:14px minmax(0,1.1fr) minmax(0,1.4fr) auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.tline input{padding:7px 8px;font-size:14px}
.tline .sc{display:flex;align-items:center;gap:4px}.tline .sc b{min-width:34px;text-align:center}
#lmapwrap{flex:1 1 44%;min-width:0;position:relative}
#lmap{position:absolute;inset:0;z-index:1}
#lside{flex:1 1 56%;min-width:0;display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line)}
#ldash{flex:1;overflow:auto;padding:12px}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:start}
.dcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.dcol .card{margin:0}
.feedbox{max-height:300px;overflow:auto}
#lsetup{flex:1;display:none;flex-direction:column;min-height:0}
#lead.setup #ldash{display:none}#lead.setup #lsetup{display:flex}
#lsetup .panel{flex:1;overflow:auto}
.reqrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.reqrow:last-child{border-bottom:0}.reqrow .nm{flex:1 1 200px;min-width:0}
@media(max-width:1250px){.dgrid{grid-template-columns:minmax(0,1fr)}}
@media(max-width:860px){#lead.nomap #lmapwrap{display:none}.lnav{position:sticky;top:0;z-index:20}#lbody{flex-direction:column;overflow:auto}#lmapwrap{flex:none;height:36vh}#lead.setup #lmapwrap{height:52vh}#lside{flex:none;border-left:0}#ldash{overflow:visible}#lsetup .panel{overflow:visible}}
.map{height:42vh;min-height:220px;flex:none;z-index:1}
.panel{flex:1;overflow:auto;padding:12px;padding-bottom:max(16px,env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--card2);color:var(--txt);cursor:pointer}
button.pri{background:var(--acc);color:#1a1200;font-weight:700}
button.red{background:var(--red);color:#fff;font-weight:700}
button.grn{background:var(--green);color:#03210f;font-weight:700}
button.sm{padding:6px 10px;font-size:13px}
button.wide{width:100%;margin-top:8px}
button:disabled{opacity:.35}
input,select,textarea{font:inherit;background:#0b1219;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
input[type=checkbox]{width:22px;height:22px;flex:none}
label{display:block;margin:8px 0 4px;color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:6px 8px;background:#0b1219;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:none;padding:8px 12px;font-size:14px}.tabs button.on{background:var(--acc);color:#1a1200;font-weight:700}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:800;background:var(--card2)}
.b-hunt{background:var(--red);color:#fff}.b-hide{background:var(--green);color:#03210f}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:middle;margin-right:4px;border:2px solid #fff}
.big{font-size:30px;font-weight:800;line-height:1.1}
.mut{color:var(--mut);font-size:13px}
.jokers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.joker{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:10px;min-height:64px}
.joker b{font-size:15px}.joker span{font-size:12px;color:var(--mut)}
.trow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow .nm{flex:1;min-width:0}
.feed div{padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}.feed div:last-child{border-bottom:0}
#home{overflow-y:auto}
.home{padding:20px;max-width:520px;margin:0 auto;width:100%;flex:none}
#modal{position:fixed;inset:0;z-index:3000;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.72);padding:16px}
#modal.on{display:flex}
#modalBox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;width:100%;max-width:440px;max-height:88vh;overflow:auto}
#pinline{flex:none;max-height:34vh;overflow:auto;position:relative;z-index:5}
#player.focus #ppanel{display:none}#player.focus #pinline{flex:1;max-height:none}#player.focus #pinbox{padding-bottom:12px}
#pinbox:empty{display:none}#pinbox{padding:8px 8px 0}
#pinbox .card{margin:0;border:2px solid var(--acc)}
#pinbox p{font-size:16px!important;margin:2px 0 8px}#pinbox .big{font-size:20px}
#pinbox .card{padding:10px}
.note{display:flex;gap:10px;align-items:center;background:var(--card);border:2px solid var(--acc);border-radius:12px;padding:8px 10px;font-weight:700;font-size:15px}.note>span{flex:1}.note button{flex:none;min-width:56px;min-height:40px}
#player .bn{padding:8px 10px;font-size:15px!important;border-radius:10px}#player .bn span{font-size:13px!important}
#pmap{height:38vh}
#ppanel .big{font-size:26px}
#player #banners{position:static;padding:8px 8px 0;pointer-events:auto}
#player #banners .bn{box-shadow:none}
#banners{position:fixed;top:calc(58px + env(safe-area-inset-top));left:8px;right:8px;z-index:1500;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.bn{display:none;border-radius:12px;padding:12px;font-weight:800;text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.4)}
#bnFreeze{background:#1e6edc;color:#fff;font-size:20px}
#bnHold{background:var(--acc);color:#1a1200}
#bnGroup{background:#ff7a00;color:#fff;font-size:16px}
#bnGroup.live{background:#c00018}
#bnZone{background:var(--red);color:#fff}
#bnLead{background:#7c3aed;color:#fff;font-size:13px;padding:6px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000d;color:#fff;padding:10px 16px;border-radius:12px;z-index:4000;display:none;max-width:90vw;text-align:center}

.leaflet-popup-content{font:14px/1.3 -apple-system,system-ui,sans-serif;color:#111;margin:8px 12px}
.numlabel{font-size:15px!important;padding:1px 7px!important}
.trk{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}.trk button{padding:6px 12px;font-size:14px;font-weight:700}.trk button.on{background:#ff2d55;color:#fff}
.pinglabel{background:rgba(0,0,0,.78)!important;color:#fff!important;border:0!important;border-radius:6px!important;font-weight:700;padding:2px 6px!important;box-shadow:none!important;font-size:12px}
.leaflet-tooltip-top.pinglabel:before{border-top-color:rgba(0,0,0,.78)!important}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{padding:6px 10px;font-size:13px}
.photo{max-width:100%;border-radius:10px;display:block;margin-top:6px}

.vtx{border-radius:50%;background:#fff;border:4px solid #16a34a;box-shadow:0 1px 6px rgba(0,0,0,.5)}
.vtx.red{border-color:#ff3b4e}.vtx.sel{background:#ffb020;transform:scale(1.25)}
.vmid{border-radius:50%;background:rgba(255,255,255,.75);border:2px dashed #16a34a}
.vmid.red{border-color:#ff3b4e}
code{background:#0b1219;padding:1px 5px;border-radius:5px}
</style>
</head>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setPath(o,p,v){const k=p.split('/');let c=o;for(let i=0;i<k.length-1;i++){if(typeof c[k[i]]!=='object'||c[k[i]]===null)c[k[i]]={};c=c[k[i]];}const last=k[k.length-1];if(v===null||v===undefined)delete c[last];else c[last]=JSON.parse(JSON.stringify(v));}
function dist(a,b){const R=6371000,r=Math.PI/180,dLat=(b.lat-a.lat)*r,dLng=(b.lng-a.lng)*r;const x=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function bearing(a,b){const dy=b.lat-a.lat,dx=(b.lng-a.lng)*Math.cos(a.lat*Math.PI/180);return (Math.atan2(dx,dy)*180/Math.PI+360)%360;}
function offsetPoint(lat,lng,m,deg){const b=deg*Math.PI/180;return {lat:lat+(m*Math.cos(b))/111320,lng:lng+(m*Math.sin(b))/(111320*Math.cos(lat*Math.PI/180))};}
function inPoly(pt,poly){let ins=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const yi=poly[i][0],xi=poly[i][1],yj=poly[j][0],xj=poly[j][1];if(((yi>pt.lat)!==(yj>pt.lat))&&(pt.lng<(xj-xi)*(pt.lat-yi)/(yj-yi)+xi))ins=!ins;}return ins;}
function fmt(ms){ms=Math.max(0,ms);const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function clock(t){return new Date(t).toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'});}
function cd(to){return `<span class="cd" data-to="${to}">${fmt(to-now())}</span>`;}
function ago(t){return `vor <span class="ago" data-t="${t}">${fmt(now()-t)}</span>`;}
function toast(msg,ms=2800){const e=$('#toast');e.textContent=msg;e.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>e.style.display='none',ms);}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
let AC=null;
function unlockAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();g.gain.value=0.0001;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+0.02);}catch(e){}}
document.addEventListener('pointerdown',()=>{if(!AC||AC.state!=='running')unlockAudio();},{passive:true});
function beep(n=3,freq=880){if(!AC)return;try{if(AC.state==='suspended')AC.resume();let t0=AC.currentTime+0.01;for(let i=0;i<n;i++){const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=i%2?freq*1.26:freq;g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.35,t0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+0.17);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+0.2);t0+=0.24;}}catch(e){}}
function alertFx(p,n){buzz(p||[300,100,300]);beep(n||3);}
function setHTML(el,html){if(el._h!==html){el._h=html;el.innerHTML=html;tick(true);}}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Script konnte nicht geladen werden'));document.head.appendChild(s);});}
function waitFor(fn,ms){return new Promise(res=>{const t0=Date.now();const iv=setInterval(()=>{if(fn()){clearInterval(iv);res(true);}else if(Date.now()-t0>ms){clearInterval(iv);res(false);}},150);});}
function genCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<4;i++)s+=a[Math.floor(Math.random()*a.length)];return s;}
function clean(up){const o={};for(const [k,v] of Object.entries(up))o[k]=(v===undefined||(typeof v==='number'&&!isFinite(v)))?null:(v===null?null:JSON.parse(JSON.stringify(v)));return o;}
window.onerror=(m)=>{toast('Fehler: '+m);};

class LocalStore{ // Demo: alles lokal im Browser
  constructor(key){this.key=key;this.subs=[];this.load();this.bc=('BroadcastChannel' in window)?new BroadcastChannel(key):null;if(this.bc)this.bc.onmessage=()=>{this.load();this.emit();};}
  load(){try{this.data=JSON.parse(localStorage.getItem(this.key)||'{}')||{}}catch(e){this.data={}}}
  offset(){return 0}
  onRoot(cb){this.subs.push(cb);setTimeout(()=>cb(this.data),0);}
  update(obj){for(const [p,v] of Object.entries(clean(obj)))setPath(this.data,p,v);this.save();return Promise.resolve();}
  clear(){this.data={};this.save();try{localStorage.removeItem(this.key+'_img')}catch(e){}return Promise.resolve();}
  pushKey(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
  save(){try{localStorage.setItem(this.key,JSON.stringify(this.data))}catch(e){}if(this.bc)this.bc.postMessage(1);this.emit();}
  emit(){this.subs.forEach(cb=>cb(this.data));}
  putImg(k,d){let m={};try{m=JSON.parse(localStorage.getItem(this.key+'_img')||'{}')}catch(e){}m[k]=d;try{localStorage.setItem(this.key+'_img',JSON.stringify(m))}catch(e){}return Promise.resolve();}
  getImg(k){try{return Promise.resolve(JSON.parse(localStorage.getItem(this.key+'_img')||'{}')[k]||null)}catch(e){return Promise.resolve(null)}}
  getTpl(){try{return Promise.resolve(JSON.parse(localStorage.getItem(this.key+'_tpl')||'null'))}catch(e){return Promise.resolve(null)}}
  putTpl(z){localStorage.setItem(this.key+'_tpl',JSON.stringify(z));return Promise.resolve();}
}
class FBStore{ // Echtbetrieb: Firebase Realtime Database
  constructor(cfg,code){if(!firebase.apps.length)firebase.initializeApp(cfg);this.db=firebase.database();this.code=code;this.ref=this.db.ref('mh/'+code);this.off=0;
    this.db.ref('.info/serverTimeOffset').on('value',s=>{this.off=s.val()||0;});
    this.db.ref('.info/connected').on('value',s=>{CONNECTED=!!s.val();scheduleRender();});}
  offset(){return this.off}
  onRoot(cb){this.ref.on('value',s=>cb(s.val()||{}),e=>toast('Datenbank-Fehler: '+e.message,6000));}
  update(obj){return this.ref.update(clean(obj)).catch(e=>toast('Speichern fehlgeschlagen: '+e.message,6000));}
  clear(){this.db.ref('mh_img/'+this.code).remove();return this.ref.remove();}

let endingN=-1;
function engineTick(){
  if(!G||!G.teams||!store)return;
  if(!(VIEW==='lead'||DEMO))return;
  const t=now(),s=S(),R=R_(),up={};
  const eng=G.engine;
  if(eng&&eng.dev!==DEV&&t-eng.t<15000){ENGINE_MINE=false;return;}
  ENGINE_MINE=true;
  if(!eng||eng.dev!==DEV||t-eng.t>5000)up.engine={dev:DEV,t};
  if(R.status==='running'&&t>=(R.startAt||0)){
    if(t>=R.endAt){if(endingN!==R.n){endingN=R.n;endRound(up);}store.update(up);return;}
    if(!R.started){up['round/started']=true;const sp=R.secondPingMin??s.secondPingMin,hw=Math.round((R.huntStartAt-R.startAt)/60000);
      noteRole(up,'hider',`🚩 Das Spiel geht los! Lass dich nicht erwischen! Der Start-Ping ist gesetzt – der nächste kommt in ${sp} Min.`);
      noteRole(up,'hunter',hw>0?`🚩 Los geht's! Ihr startet in ${hw} Min. – der Start-Ping kommt jetzt.`:`🚩 Los geht's! Der Start-Ping ist auf der Karte. Viel Erfolg bei der Jagd!`);}
    let act=0;
    for(const [id,tm] of Object.entries(G.teams)){
      if(tm.role==='hider'&&!tm.caught){
        act++;
        if(tm.nextPingAt&&t>=tm.nextPingAt){const k=autoPing(up,id,tm,tm.firstPing?'start':'auto');const gap=tm.firstPing?(R.secondPingMin??s.secondPingMin):s.pingEveryMin;up[`teams/${id}/nextPingAt`]=t+(k==='nosignal'?30000:gap*60000);if(k!=='nosignal')up[`teams/${id}/firstPing`]=null;}
      }
      if(tm.role==='hider'||tm.role==='hunter'){ // Spielzone: Disqualifikation
        const p=latestPos(id);
        if(p&&t-p.t<60000&&(p.acc||0)<=60){const v=zoneViolation(p);
          if(v&&!tm.outSince){up[`teams/${id}/outSince`]=t;ev(up,`⚠️ ${tm.name} ist ${v==='red'?'in einer Sperrzone':'ausserhalb des Spielfelds'}!`,'lead');}
          else if(v&&t-tm.outSince>=s.dqGraceSec*1000){disqualify(up,id,tm,v);if(tm.role==='hider')act--;}
          else if(!v&&tm.outSince)up[`teams/${id}/outSince`]=null;}
      }
      if(tm.role==='hunter'&&t>=R.huntStartAt&&tm.nextCreditAt&&t>=tm.nextCreditAt){up[`teams/${id}/credits`]=(tm.credits||0)+1;up[`teams/${id}/nextCreditAt`]=tm.nextCreditAt+s.hunterJokerEveryMin*60000;}
    }
    if(t>=R.huntStartAt)groupCheck(up,t,s);
    speedTick(up,t,s);
    challengeCheck(up,t,s);
    inactiveCheck(up,t,s,R);
    if(act<=0&&endingN!==R.n){endingN=R.n;endRound(up);ev(up,'🎯 Alle Teams wurden gefangen!','all');}
  }
  if(Object.keys(up).length)store.update(up);
}
let ENGINE_MINE=true;
function disqualify(up,id,tm,v){
  const why=v==='red'?'Sperrzone betreten':v==='out'?'Spielfeld verlassen':v;
  const T=`teams/${id}/`,lost=(tm.score||0)-(tm.scoreStart??(tm.score||0));
  up[T+'dqPrevRole']=tm.role;up[T+'role']='out';up[T+'dq']=true;up[T+'dqLost']=lost;up[T+'score']=tm.scoreStart??(tm.score||0);up[T+'outSince']=null;
  const sp=R_().speed;if(sp&&sp.target===id){up['round/speed']=null;}
  ev(up,`❌ ${tm.name} ist disqualifiziert (${why}) – 0 Punkte in dieser Runde.`,'all');

}

function catchUpdates(up,k,c,isNew){

  const mins=Math.floor((t-R.startAt)/60000),first=!(R.catches>0),cp=s.catchPts+(first?s.firstCatchBonus:0);
  if(isNew)up['catches/'+k]={...c,status:'ok'};else up[`catches/${k}/status`]='ok';
  const T=`teams/${c.target}/`;
  up[T+'caught']=true;up[T+'caughtAt']=t;up[T+'role']='caught';up[T+'used']=null;
  up[T+'score']=(tg.score||0)+mins*s.ppm;up[T+'shieldUntil']=null;up[T+'skipNext']=null;up[T+'fakeNext']=null;up[T+'freezeUntil']=null;up[T+'exposedUntil']=null;
  up[`teams/${c.hunter}/score`]=(hu.score||0)+cp;up['round/catches']=(R.catches||0)+1;
  if(R.speed&&R.speed.target===c.target){up['round/speed']=null;if((R.speedLeft||0)>0)up['round/speedLeft']=0;ev(up,`⚡ Speedhunt erfolgreich!${(R.speedLeft||0)>0?' Der übrige Speedhunt verfällt.':''}`,'all');}
  ev(up,`🎯 ${hu.name} hat ${tg.name} gefangen! (+${cp}${first?' inkl. Bonus erster Fang':''})`,'all');

  return true;
}

async function audioURL(k){if(audioCache[k])return audioCache[k];const d=imgCache[k]||(imgCache[k]=await store.getImg(k));if(!d)return null;

  return audioCache[k]=URL.createObjectURL(blob);}

  }else proxFrozen=false;

    else if(exposed(MY_TEAM))gb=`🔴 Live-Standort noch ${fmt(tm.exposedUntil-t)} für die Jäger sichtbar.`;
    else gEl._k='';
  }else if(running()&&tm.role==='hunter'&&huntOn()){const ex=activeHiders().filter(([id])=>exposed(id));if(ex.length){gb=`🔴 LIVE sichtbar: ${ex.map(([id])=>tnum(id)).join(', ')}`;const gk=ex.map(x=>x[0]).join();if(gEl._k!==gk){gEl._k=gk;alertFx([300,100,300],3);}}else gEl._k='';}
  gEl.classList.toggle('live',gb.startsWith('🔴'));showBn('bnGroup',gb);
  const me=myPos();let zn='';
  if(me&&running()&&now()>=R_().startAt&&tm.role!=='out'){const v=zoneViolation(me);if(v){const left=tm.outSince?tm.outSince+s.dqGraceSec*1000-t:s.dqGraceSec*1000;zn=`${v==='red'?'🚫 Sperrzone! Sofort verlassen!':'🚫 Ausserhalb des Spielfelds! Sofort zurück!'}<br><span style="font-size:14px">Sonst Disqualifikation in ${Math.max(0,Math.ceil(left/1000))} Sek.</span>`;if(!zoneBuzzed){zoneBuzzed=true;alertFx([600,200,600],6);}}else zoneBuzzed=false;}

function applyJoker(up,r){
  const tm=teams()[r.team],t=now(),s=S(),R=R_(),T=`teams/${r.team}/`,j=jinfo(r.kind);if(!tm||!running())return false;
  if(JH[r.kind]){
    if(tm.role!=='hider'||tm.caught||!((tm.jokers||{})[r.kind]>0))return false;
    up[T+'jokers/'+r.kind]=tm.jokers[r.kind]-1;
    if(r.kind==='invisible')up[T+'skipNext']=true;
    if(r.kind==='fake')up[T+'fakeNext']=true;
    if(r.kind==='reveal'){const pts={};for(const [id,o] of Object.entries(teams()))if(o.role==='hunter'){const q=latestPos(id);if(q&&t-q.t<120000)pts[id]={lat:q.lat,lng:q.lng};}up[T+'reveal']={t,pts};}
    ev(up,`${j.icon} ${tm.name} setzt «${j.name}» ein`,'lead');return true;}
  const tg=teams()[r.target];
  if(tm.role!=='hunter'||!tg||tg.role!=='hider'||tg.caught)return false;
  if(r.kind==='speedhunt'){
    if((R.speedLeft||0)<1||R.speed)return false;
    const p=latestPos(r.target),ok=p&&t-p.t<120000;pushPing(up,r.target,ok?p:null,ok?'speed':'nosignal');
    up['round/speed']={target:r.target,by:r.team,start:t,endAt:t+s.speedhuntMin*60000,left:s.speedhuntPings,used:1};up['round/speedLeft']=R.speedLeft-1;
    ev(up,`⚡ SPEEDHUNT! ${tm.name} jagt ${tg.name} (${tnum(r.target)}) – ${s.speedhuntMin} Min., erster Ping gesetzt.`,'all');
    noteRole(up,'hunter',`⚡ Speedhunt auf ${tnum(r.target)} läuft! Der erste Ping ist auf der Karte. Ihr könnt in den nächsten ${s.speedhuntMin} Min. noch ${s.speedhuntPings} Pings auslösen.`,r.team);
    return true;}
  if(r.kind==='question'||r.kind==='photo'){
    if((tm.used||{})[r.kind])return false;up[T+'used/'+r.kind]=true;
    if(r.kind==='question'){up['questions/'+store.pushKey()]={from:r.team,to:r.target,text:r.text||'',t,round:R.n};ev(up,`❓ ${tm.name} stellt ${tg.name} eine Frage`,'lead');}
    else{up['photos/'+store.pushKey()]={from:r.team,to:r.target,t,round:R.n,task:r.text||'Fotografiert eure Umgebung'};ev(up,`📸 ${tm.name} gibt ${tg.name} eine Foto-Challenge`,'lead');}
    return true;}
  return false;
}

function startRound(){
  const s=S(),t=now(),R=R_(),tms=teams();const hs=[...hunterSel].filter(id=>tms[id]);
  if(!hs.length){toast('Mindestens ein Jäger-Team wählen');return;}
  if(hs.length>=Object.keys(tms).length){toast('Mindestens ein Team muss gejagt werden');return;}
  const sec=Math.max(1,+rSecond||s.secondPingMin),dur=Math.max(1,+rDur||s.roundMin),head=Math.max(0,+rHead||0),n=(R.n||0)+1,t0=t+Math.max(0,+s.countdownSec||0)*1000,hs0=t0+head*60000;
  const up={round:{n,status:'running',startAt:t0,announcedAt:t,huntStartAt:hs0,endAt:t0+dur*60000,catches:0,speedLeft:s.speedhuntMax,secondPingMin:sec},groups:null,notes:null};
  const hid=Object.keys(tms).filter(id=>!hs.includes(id)),codes=hid.map((_,i)=>i+1).sort(()=>Math.random()-.5);
  for(const [id,o] of Object.entries(tms)){const T=`teams/${id}/`,isH=hs.includes(id);
    up[T+'code']=isH?null:codes[hid.indexOf(id)];
    up[T+'role']=isH?'hunter':'hider';up[T+'caught']=false;up[T+'caughtAt']=null;
    up[T+'credits']=null;up[T+'nextCreditAt']=null;up[T+'used']=null;up[T+'inactiveAt']=null;
    up[T+'jokers']=isH?null:{...s.hiderJokers};up[T+'nextPingAt']=isH?null:t0;up[T+'firstPing']=isH?null:true;
    up[T+'skipNext']=null;up[T+'fakeNext']=null;up[T+'shieldUntil']=null;up[T+'freezeUntil']=null;up[T+'lastZonePingAt']=null;up[T+'exposedUntil']=null;up[T+'outSince']=null;up[T+'dq']=null;up[T+'dqLost']=null;up[T+'dqPrevRole']=null;up[T+'reveal']=null;up[T+'scoreStart']=o.score||0;
    if(isH)up[T+'hunterStarts']=(o.hunterStarts||0)+1;}
  ev(up,`🚦 Runde ${n}: Countdown läuft – Start in ${s.countdownSec} Sek. Jäger: ${hs.map(id=>tms[id].name).join(', ')}.`,'all');
  store.update(up);hunterSel=null;endingN=-1;toast('Countdown gestartet');
}

let drawSig=null,dragging=false,draftPoly=null;
const rnd=ll=>[+ll.lat.toFixed(6),+ll.lng.toFixed(6)];
function drawDraft(){
  if(!LM||dragging)return;
  const sig=DRAW?JSON.stringify([DRAW.type,DRAW.pts,DRAW.sel]):'';if(sig===drawSig)return;drawSig=sig;
  LM.e.clearLayers();draftPoly=null;if(!DRAW||!DRAW.pts.length)return;
  const red=DRAW.type==='red',c=red?'#ff3b4e':'#16a34a',n=DRAW.pts.length;
  draftPoly=(n>2?L.polygon(DRAW.pts,{color:c,weight:3,dashArray:'6',fillOpacity:.15,interactive:false}):L.polyline(DRAW.pts,{color:c,weight:3,dashArray:'6',interactive:false})).addTo(LM.e);
  const done=()=>{dragging=false;drawSig=null;renderLead(true);};
  const segs=n>2?n:n-1;
  for(let i=0;i<segs;i++){const a=DRAW.pts[i],b=DRAW.pts[(i+1)%n];const mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];let idx=null;
    const mk=L.marker(mid,{draggable:true,icon:L.divIcon({className:'vmid'+(red?' red':''),iconSize:[16,16]}),zIndexOffset:500}).addTo(LM.e);
    mk.on('dragstart',()=>{dragging=true;idx=i+1;DRAW.pts.splice(idx,0,mid);DRAW.sel=null;});
    mk.on('drag',e=>{DRAW.pts[idx]=rnd(e.target.getLatLng());draftPoly.setLatLngs(DRAW.pts);});
    mk.on('dragend',done);}
  DRAW.pts.forEach((p,i)=>{
    const mk=L.marker(p,{draggable:true,icon:L.divIcon({className:'vtx'+(red?' red':'')+(DRAW.sel===i?' sel':''),iconSize:[24,24]}),zIndexOffset:1000}).addTo(LM.e);
    mk.on('dragstart',()=>{dragging=true;DRAW.sel=i;});
    mk.on('drag',e=>{DRAW.pts[i]=rnd(e.target.getLatLng());draftPoly.setLatLngs(DRAW.pts);});
    mk.on('dragend',done);
    mk.on('click',()=>{DRAW.sel=DRAW.sel===i?null:i;drawSig=null;renderLead(true);});});
}

const demoHead={};
function demoTick(){
  if(!DEMO||!G||!G.teams||!store)return;
  const t=now(),R=R_(),up={},run=R.status==='running',hunt=run&&t>=R.huntStartAt;
  for(const [id,o] of Object.entries(G.teams)){
    if(VIEW==='player'&&id===MY_TEAM)continue;
    let p=latestPos(id);
    if(!p){for(let i=0;i<30;i++){p={lat:CENTER[0]+(Math.random()-.5)*.006,lng:CENTER[1]+(Math.random()-.5)*.009};if(!zoneViolation(p))break;}}
    let speed=1.3,brg=demoHead[id]??Math.random()*360;
    if(run&&o.role==='hunter'&&hunt){speed=2.6;let best=null,bd=Infinity;
      for(const [hid,ho] of activeHiders()){const real=latestPos(hid);if(real&&dist(p,real)<70){const d=dist(p,real);if(d<bd){bd=d;best=real;}continue;}const lp=lastPing(hid);if(lp&&lp.lat!=null){const d=dist(p,lp);if(d<bd&&d>25){bd=d;best=lp;}}}
      if(best)brg=bearing(p,best)+(Math.random()-.5)*40;else brg+=(Math.random()-.5)*60;}
    else if(run&&o.role==='hider'&&!o.caught){speed=t<R.huntStartAt?2:0.8;brg+=(Math.random()-.5)*50;const gs=myGroups(id);if(gs.length&&Math.random()<.5){const g=gs[0];const op=latestPos(g.a===id?g.b:g.a);if(op){brg=bearing(op,p);speed=1.6;}}if((o.freezeUntil||0)>t)speed=0;}
    else brg+=(Math.random()-.5)*60;
    let np=offsetPoint(p.lat,p.lng,speed*2,brg);
    if(zoneViolation(np)){brg=(brg+150+Math.random()*60)%360;np=offsetPoint(p.lat,p.lng,speed*2,brg);if(zoneViolation(np))np=p;}
    demoHead[id]=brg;
    up[`pos/${id}/bot`]={lat:np.lat,lng:np.lng,acc:6,t};
    if(hunt&&o.role==='hunter'){for(const [hid] of activeHiders()){const hp=latestPos(hid);if(hp&&dist(np,hp)<14&&!Object.values(G.catches||{}).some(c=>c.hunter===id&&c.target===hid&&c.round===R.n&&c.status==='pending'&&t-c.t<30000)){up['catches/'+store.pushKey()]={hunter:id,target:hid,t,status:'pending',round:R.n};}}}
  }
  const bot=id=>!(VIEW==='player'&&id===MY_TEAM);
  for(const [k,c] of Object.entries(G.catches||{}))if(c.status==='pending'&&bot(c.target)&&t-c.t>2000){catchUpdates(up,k,c,false);break;}
  for(const [k,q] of Object.entries(G.questions||{}))if(!q.answer&&bot(q.to)&&t-q.t>3000){up[`questions/${k}/answer`]=Math.random()<.5?'ja':'nein';up[`questions/${k}/at`]=t;}
  for(const [k,p] of Object.entries(G.photos||{}))if(!p.img&&bot(p.to)&&t-p.t>4000){const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320"><rect width="100%" height="100%" fill="#5b7f4a"/><rect y="200" width="100%" height="120" fill="#777"/><text x="50%" y="45%" font-size="34" text-anchor="middle" fill="#fff" font-family="sans-serif">📷 Demo-Foto</text></svg>`;store.putImg(k,'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg));up[`photos/${k}/img`]=true;up[`photos/${k}/at`]=t;}
  store.update(up);
}
setInterval(demoTick,2000);

async function bakeConfig(){
  const cfg=getCfg();if(!cfg){toast('Zuerst die Konfiguration speichern');return;}
  let src;try{src=await (await fetch(location.href.split(/[?#]/)[0],{cache:'no-store'})).text();}catch(e){toast('Geht nur, wenn die Seite online (z.B. GitHub Pages) geöffnet ist.',6000);return;}
  const mark='const FIREBASE_CONFIG = null;';if(!src.includes(mark)){toast('Diese Datei enthält schon eine Konfiguration.',5000);return;}

async function startDemo(){await connect('DEMO');await waitFor(()=>G!==null,2000);if(!G.teams)await store.update(initialGame(true));openLead();}
renderHome();
async function checkUpdate(){if(location.protocol==='file:'||DEMO)return;try{const txt=await (await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'})).text();const m=txt.match(/APP_VERSION = '([^']+)'/);
  if(m&&m[1]!==APP_VERSION&&!$('#updBar')){const d=document.createElement('div');d.id='updBar';d.style.cssText='position:fixed;left:8px;right:8px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:5000;background:var(--acc);color:#1a1200;font-weight:800;padding:12px;border-radius:12px;text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.5)';d.textContent='🔄 Neue Version verfügbar – hier tippen zum Aktualisieren';d.onclick=()=>location.reload();document.body.appendChild(d);}}catch(e){}}
setTimeout(checkUpdate,5000);setInterval(checkUpdate,120000);
</script>
</body>
</html>
